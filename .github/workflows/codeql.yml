name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    # Two subprojects under different directories declare the same package
    # and class names (they're the same mod built against different Sodium
    # API versions - see the root README). Scanning them together under
    # build-mode: none made CodeQL treat identical-FQCN classes across the
    # two as duplicates and filter them out. Building each one for real, in
    # its own job, means only that subproject's classes are ever compiled
    # and traced in a given run - no cross-directory clash, and real
    # classpath resolution (Sodium/Minecraft/Fabric API) instead of the
    # low-confidence source-only scan build-mode: none falls back to.
    strategy:
      fail-fast: false
      matrix:
        target: ["26.2", "26.3"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build ${{ matrix.target }}
        working-directory: ${{ matrix.target }}
        run: ./gradlew build --console=plain --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin-mc${{ matrix.target }}"
